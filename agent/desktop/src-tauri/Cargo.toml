[package]
name = "desktop"
version = "0.1.0"
description = "CORAX tray inventory agent for Windows 10/11"
authors = ["CORAX"]
edition = "2021"

[[bin]]
name = "CORAX-Agent"
path = "src/main.rs"

[lib]
name = "desktop_lib"

[build-dependencies]
winresource = "0.1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wmi = "0.14"
ureq = { version = "2.12", features = ["json", "tls"] }
winreg = "0.52"
tray-icon = { version = "0.21", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
